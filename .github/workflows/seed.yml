name: Build seed image

on:
  pull_request:
    paths: [Dockerfile.seed, .github/workflows/seed.yml]
  push:
    branches: [master]
    paths: [Dockerfile.seed, .github/workflows/seed.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke test both architectures
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --platform "$platform" --file Dockerfile.seed --tag seed-test --load .
            docker run --rm --platform "$platform" --entrypoint bash seed-test -ec '
              psql --version
              pg_restore --version
              pg_isready --version
              curl --version
              test -s /etc/ssl/certs/ca-certificates.crt
              curl --fail --silent --show-error --head --max-time 30 https://www.postgresql.org/ >/dev/null
              gzip --version
              test "$(id -u)" != 0
            '
          done
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish seed image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.seed
          platforms: linux/amd64,linux/arm64
          push: true
          tags: dhis2/postgresql-curl:17-bookworm
