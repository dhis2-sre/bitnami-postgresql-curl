name: Build PostgreSQL curl image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and validate both architectures
        # Refresh Debian packages daily even though the Bitnami base is pinned.
        # Publication reuses these freshly built and tested layers.
        env:
          TEST_BUILD_FLAGS: ${{ github.event_name == 'schedule' && '--no-cache' || '' }}
        run: make test
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish multiarchitecture image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: make push-all
